version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Stay on the Node 24 LTS line; major bumps are a deliberate runtime change.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: sunday
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
