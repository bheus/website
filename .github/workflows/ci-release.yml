name: CI and release

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and publish
    # Native arm64 so the Gatsby build is not emulated for the Raspberry Pi target.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      # Portainer deploys this compose file alone, with no .env and no override,
      # so every variable must interpolate from the default written here. A bad
      # default breaks nothing else in this pipeline — the image still publishes
      # and CI stays green — it only stops the stack redeploying, leaving the Pi
      # on a stale image. `--env-file /dev/null` reproduces that empty environment.
      - name: Validate deployment compose
        run: docker compose -f docker-compose.yml --env-file /dev/null config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/bheus/website:${{ github.sha }}
            ghcr.io/bheus/website:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The stack consumes the :latest tag, so the redeploy is triggered only
      # after the push above has published it.
      - name: Trigger Portainer redeploy
        if: github.event_name == 'push' && env.PORTAINER_WEBSITE_WEBHOOK != ''
        env:
          PORTAINER_WEBSITE_WEBHOOK: ${{ secrets.PORTAINER_WEBSITE_WEBHOOK }}
        run: curl -fsSL -X POST "$PORTAINER_WEBSITE_WEBHOOK"
