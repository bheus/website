version: '3.8'

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    image: brendan-website:latest
    container_name: brendan-website
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    networks:
      - web
    labels:
      - "com.website.description=Brendan's Personal Website"

networks:
  web:
    driver: bridge

