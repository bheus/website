services:
  website:
    image: ${WEBSITE_IMAGE:-ghcr.io/bheus/website:latest}
    container_name: brendan-website
    restart: unless-stopped
    ports:
      - "80:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=8080
      - CONTACT_TO=${CONTACT_TO:-}
      - CONTACT_FROM=${CONTACT_FROM:-}
      - CONTACT_SUBJECT_PREFIX=${CONTACT_SUBJECT_PREFIX:-Website inquiry}
      - CONTACT_ALLOWED_ORIGIN=${CONTACT_ALLOWED_ORIGIN:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_REQUIRE_TLS=${SMTP_REQUIRE_TLS:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - TRUST_PROXY=${TRUST_PROXY:-false}
    networks:
      - web
    labels:
      - "com.website.description=Brendan's Personal Website"

networks:
  web:
    driver: bridge
